# Mantiene despierto el servicio de pagos casi todo el día.
#
# El problema: un servicio free duerme tras 15 min sin tráfico y tarda ~1 min en
# despertar. El peor momento posible para eso es el regreso del cliente desde
# Flow: la confirmación del pago ocurre en ese redirect, así que el comprador
# vería un minuto de pantalla de carga justo cuando se pregunta dónde quedó su
# plata. No es estética, es la confianza en el cobro.
#
# ── POR QUÉ AHORA SE PUEDE (2026-07-28) ─────────────────────────────────────
# Render da 750 h de instancia al mes POR WORKSPACE y al agotarlas suspende
# TODOS los servicios free de ese workspace hasta el día 1. Antes, pagos y
# WhatsApp compartían un solo presupuesto y esto solo alcanzaba para 16 h/día.
#
# Este servicio vive ahora SOLO en el workspace "Zelix Pagos", con sus 750 h
# propias. Render no permite transferir servicios entre workspaces (no hay
# opción en el dashboard, `/transfer` da 404 y un PATCH con ownerId se ignora en
# silencio), así que se recreó por API replicando repo, comandos y variables.
# WhatsApp quedó solo en el workspace original con sus otras 750 h: ninguno de
# los dos puede volver a apagar al otro por consumo.
#
# ── PRESUPUESTO (750 h/mes, solo para este servicio) ────────────────────────
#   despierto 23 h/día × 31 días .............. 713 h
#   cola de 15 min tras el último ping ........ 8 h
#   deploys (instancia nueva mientras drena) .. 2 h
#   monitoreo ................................. 0 h  ← ver nota
#   ─────────────────────────────────────────────────
#   total ..................................... 723 h de 750 (margen 27 h, 3,6%)
#
# Nota sobre el monitoreo: los chequeos de salud de monitor.yml corren a las
# 09, 16 y 23 UTC, todos DENTRO de esta ventana. Despiertan un servicio que ya
# está despierto, así que no cuestan una hora extra. Si se mueve este cron, hay
# que mover aquellos o el costo aparece de vuelta.
#
# ── POR QUÉ 23 h Y NO 24 ────────────────────────────────────────────────────
# Un mes de 31 días son 744 h contra 750 disponibles: seis horas de margen,
# menos del 1%, y cada deploy levanta una instancia nueva mientras drena la
# vieja. Invirtiendo la cuenta, conservar un 5% de colchón permite 750 × 0,95 ÷
# 31 = 22,98 h/día. El hueco va de 04:00 a 05:00 de Chile: nadie compra a esa
# hora, y si alguien lo hace paga un arranque en frío que nadie está esperando.
# Es 24/7 para efectos del negocio, pero sobrevive a un mes con muchos deploys.

name: Keep-alive

on:
  schedule:
    # Cada 10 min en todas las horas UTC salvo la 08 (= 04:00 en Chile, UTC-4).
    - cron: '*/10 0-7,9-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive-zelixpay
  cancel-in-progress: true

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Se golpea /health (liveness puro) y NO /api/health: el segundo consulta
      # Postgres en cada llamada, y ~4.200 consultas al mes solo para mantener
      # el proceso despierto son gasto sin información. El health real —base,
      # entorno, proveedores— lo revisa monitor.yml tres veces al día.
      - name: Ping
        run: |
          set -euo pipefail
          curl -sS --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
            -o respuesta.json -w "HTTP %{http_code} en %{time_total}s\n" \
            https://zelixpay-qy3w.onrender.com/health
          cat respuesta.json
